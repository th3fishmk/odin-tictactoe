<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet"
        href="./styles.css" />
    <script>
        var exports = {};
    </script>
    <script src="./dist/index.js"
        defer></script>
</head>

<body>
    <h1>Tic tac toe</h1>
    <p>Player turn:</p>
    <div id="turn"
        class="square tied1"></div>
    <div class="game">
        <div class="cont">
            <div class="row"
                id="1">
            </div>
            <div class="row"
                id="2">
            </div>
            <div class="row"
                id="3">
            </div>
            <div class="row"
                id="4">
            </div>
            <div class="row"
                id="5">
            </div>
            <div class="row"
                id="6"></div>
            <div class="row"
                id="7">
            </div>
            <div class="row"
                id="8"></div>
            <div class="row"
                id="9">
            </div>
        </div>
    </div>
    <div id="horiBar"
        class="bar horizontal hidden"></div>
    <div id="vertBar"
        class="bar vertical hidden"></div>
    <div id="diagBar"
        class="bar diagonal hidden"></div>
    <dialog id="winner">
        <p id="player-winner">player 1 won!</p>
        <br>
        <button type="button"
            onclick="window.location.reload()">Start again!</button>
    </dialog>

</body>

</html>
